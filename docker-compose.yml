services:
  mysql:
    image: mysql:8.4
    container_name: mtgrealm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mtgrealm
      MYSQL_USER: mtgrealm
      MYSQL_PASSWORD: mtgrealm
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
